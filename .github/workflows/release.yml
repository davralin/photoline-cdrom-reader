name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test source and Windows test cross-build in Go container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            golang:1.27.4 \
            sh -ec 'export GOFLAGS=-buildvcs=false; go test ./... && go vet ./... && GOOS=windows GOARCH=amd64 go test -c -o /tmp/reader-tests.exe'

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Linux and Windows binaries in Go container
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/release:/out" \
            -w /src \
            golang:1.27.4 \
            sh -ec '\
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-s -w" -o /out/photoline-cdrom-reader-linux-amd64 . && \
              CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-s -w" -o /out/photoline-cdrom-reader-windows-amd64.exe . && \
              cd /out && sha256sum photoline-cdrom-reader-linux-amd64 photoline-cdrom-reader-windows-amd64.exe > SHA256SUMS'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: photoline-cdrom-reader
        run: |
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/$PACKAGE_NAME/visibility" \
            -d '{"visibility":"public"}'

  publish:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-binaries
          path: release-assets
      - uses: softprops/action-gh-release@v3.0.4
        with:
          name: PhotoLine CD-ROM Reader ${{ github.ref_name }}
          body_path: CHANGELOG.md
          make_latest: true
          files: |
            release-assets/photoline-cdrom-reader-linux-amd64
            release-assets/photoline-cdrom-reader-windows-amd64.exe
            release-assets/SHA256SUMS
            docs/screenshot-synthetic.png
            docs/THIRD_PARTY_NOTICES.md
