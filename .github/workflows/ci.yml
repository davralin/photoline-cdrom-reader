name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test and cross-compile checks in Go container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            golang:1.27.4 \
            sh -ec 'export GOFLAGS=-buildvcs=false; go test ./... && go vet ./... && GOOS=windows GOARCH=amd64 go test -c -o /tmp/reader-tests.exe'
      - name: Build container image
        run: docker build --tag photoline-cdrom-reader:ci .
